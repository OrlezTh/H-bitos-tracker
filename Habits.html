<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Habit Tracker 🌿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0d1117; color: #e2e8f0; font-family: 'Sora', sans-serif; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }

  .shell { min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }
  .page { max-width: 480px; width: 100%; margin: 0 auto; padding: 24px 16px 40px; flex: 1; display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes ripple { 0%{box-shadow:0 0 0 0 rgba(163,230,53,.45)} 100%{box-shadow:0 0 0 35px rgba(163,230,53,0)} }
  @keyframes pulseRing { 0%{transform:translate(-50%,-50%) scale(.4);opacity:.9} 100%{transform:translate(-50%,-50%) scale(2.2);opacity:0} }

  .heading { font-size: 22px; font-weight: 800; color: #f1f5f9; }
  .sub { color: #6b7280; font-size: 13px; margin-top: 4px; }
  .section-label { font-size: 11px; letter-spacing: 2px; color: #4b5563; font-weight: 700; margin-bottom: 10px; margin-top: 4px; text-transform: uppercase; }

  .card { background: #131820; border: 1px solid #1e2533; border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; }
  .stat-card { background: #131820; border: 1px solid #1e2533; border-radius: 14px; padding: 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .stat-val { font-size: 22px; font-weight: 800; color: #a3e635; }
  .stat-lbl { font-size: 11px; color: #6b7280; }

  .cat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .cat-btn { border-radius: 12px; padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.15s; font-family: inherit; font-size: 11px; font-weight: 600; border: 2px solid #2a3040; background: #1a1f2e; color: #6b7280; }
  .cat-btn.active { }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600; transition: all 0.15s; background: #1a1f2e; color: #9ca3af; border: 1px solid #2a3040; }

  .pill { background: #1e2533; color: #9ca3af; border-radius: 20px; padding: 2px 8px; font-size: 11px; }
  .badge { background: #a3e635; color: #1a2e05; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 800; }

  textarea { width: 100%; background: #131820; border: 1px solid #1e2533; border-radius: 12px; color: #e2e8f0; padding: 10px 14px; font-size: 14px; resize: none; outline: none; margin-bottom: 16px; font-family: inherit; }
  textarea:focus { border-color: #a3e635; }

  .big-btn { width: 100%; background: linear-gradient(135deg,#166534,#15803d); border: none; border-radius: 18px; padding: 20px 24px; color: #dcfce7; cursor: pointer; display: flex; align-items: center; gap: 16px; margin-bottom: 24px; font-family: inherit; text-align: left; transition: transform 0.15s; }
  .big-btn:active { transform: scale(0.98); }
  .big-btn-title { font-weight: 800; font-size: 17px; }
  .big-btn-sub { font-size: 12px; color: #86efac; opacity: .8; }

  .btn-pri { flex: 1; background: #a3e635; color: #1a2e05; border: none; border-radius: 12px; padding: 13px; font-weight: 800; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn-sec { flex: 1; background: #1a1f2e; color: #6b7280; border: 1px solid #2a3040; border-radius: 12px; padding: 13px; font-weight: 600; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }

  .nav-btn { flex: 1; background: #131820; border: 1px solid #1e2533; color: #9ca3af; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .back-btn { background: #131820; border: 1px solid #1e2533; color: #9ca3af; border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; font-family: inherit; }

  .notif-banner { background: #131820; border: 1px solid #f59e0b66; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .notif-banner button { background: #f59e0b22; border: 1px solid #f59e0b55; color: #f59e0b; border-radius: 10px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }

  .mood-row { display: flex; gap: 12px; margin-bottom: 24px; }
  .mood-btn { font-size: 26px; background: none; border: none; cursor: pointer; transition: all 0.15s; opacity: 0.4; padding: 0; }
  .mood-btn.active { opacity: 1; transform: scale(1.3); }

  .pulse-ring { position: fixed; top: 50%; left: 50%; width: 200px; height: 200px; border-radius: 50%; border: 3px solid #a3e635; animation: pulseRing 1s ease-out forwards; pointer-events: none; z-index: 50; }

  .countdown { font-size: 20px; font-weight: 800; color: #a3e635; font-variant-numeric: tabular-nums; letter-spacing: 1px; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-track { flex: 1; background: #1a1f2e; border-radius: 99px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s; }

  .entry-row { display: flex; gap: 10px; align-items: flex-start; }
  .entry-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .time-tag { color: #374151; font-size: 11px; margin-top: 4px; }
  .del-btn { background: none; border: none; color: #374151; cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
  .del-btn:hover { color: #ef4444; }

  .today-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .today-chip { border-radius: 10px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }

  #view-checkin, #view-history, #view-stats { display: none; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="shell" id="app">

  <!-- ═══ HOME ═══════════════════════════════════════════════════════════ -->
  <div id="view-home" class="page">
    <div style="display:flex;align-items:center;margin-bottom:28px">
      <div>
        <div style="font-size:11px;color:#4b5563;letter-spacing:3px;font-weight:700">HABIT TRACKER</div>
        <div class="heading">Tu día 🌿</div>
      </div>
      <div style="flex:1"></div>
      <div style="text-align:right">
        <div style="font-size:10px;color:#4b5563">próximo check-in</div>
        <div class="countdown" id="countdown">--:--</div>
      </div>
    </div>

    <div class="notif-banner" id="notif-banner" style="display:none">
      <span style="font-size:20px">🔔</span>
      <div style="flex:1;font-size:13px;color:#d1d5db">Activá notificaciones para avisos cada hora</div>
      <button onclick="requestNotif()">Activar</button>
    </div>

    <button class="big-btn" id="checkin-now-btn" onclick="openCheckin()">
      <span style="font-size:32px">✏️</span>
      <div>
        <div class="big-btn-title">Registrar ahora</div>
        <div class="big-btn-sub">¿Qué estás haciendo?</div>
      </div>
    </button>

    <div id="last-entry-section" style="display:none;margin-bottom:20px">
      <div class="section-label">Último registro</div>
      <div class="card" id="last-entry-card" style="border-left:3px solid #888"></div>
    </div>

    <div id="today-section" style="display:none;margin-bottom:20px">
      <div class="section-label" id="today-label">Hoy — 0 registros</div>
      <div class="today-chips" id="today-chips"></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:auto;padding-top:16px">
      <button class="nav-btn" onclick="showView('history')">📋 Historial</button>
      <button class="nav-btn" onclick="showView('stats')">📊 Stats</button>
    </div>
  </div>

  <!-- ═══ CHECK-IN ══════════════════════════════════════════════════════ -->
  <div id="view-checkin" class="page">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:36px;margin-bottom:8px">⏰</div>
      <div class="heading">¿Qué estás haciendo?</div>
      <div class="sub" id="checkin-time"></div>
    </div>

    <div class="section-label">Categoría</div>
    <div class="cat-grid" id="cat-grid"></div>

    <div id="options-section" style="display:none">
      <div class="section-label">Actividad rápida</div>
      <div class="chips" id="options-chips"></div>
    </div>

    <div class="section-label">Nota libre (opcional)</div>
    <textarea id="checkin-note" rows="2" placeholder="Ej: Trabajé en el proyecto X, comí sano..."></textarea>

    <div class="section-label">Estado de ánimo</div>
    <div class="mood-row" id="mood-row"></div>

    <div class="btn-row">
      <button class="btn-sec" onclick="showView('home')">Cancelar</button>
      <button class="btn-pri" id="save-btn" onclick="saveEntry()" style="opacity:.4" disabled>Guardar ✓</button>
    </div>
  </div>

  <!-- ═══ HISTORY ═══════════════════════════════════════════════════════ -->
  <div id="view-history" class="page">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button class="back-btn" onclick="showView('home')">←</button>
      <div class="heading">Historial</div>
      <div style="flex:1"></div>
      <span class="badge" id="history-count">0</span>
    </div>
    <div id="history-list"></div>
  </div>

  <!-- ═══ STATS ════════════════════════════════════════════════════════ -->
  <div id="view-stats" class="page">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button class="back-btn" onclick="showView('home')">←</button>
      <div class="heading">Estadísticas</div>
    </div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="section-label">Distribución por categoría</div>
    <div id="stats-bars"></div>
  </div>

</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'habittracker_v2';

const CATEGORIES = [
  { id:'work',   label:'Trabajo',   emoji:'💼', color:'#3b82f6', options:['Trabajando','Reunión','Estudiando','Planificando','Emails'] },
  { id:'health', label:'Ejercicio', emoji:'🏃', color:'#10b981', options:['Ejercitando','Caminando','Estirando','Descanso activo'] },
  { id:'food',   label:'Comida',    emoji:'🍽️', color:'#f59e0b', options:['Desayunando','Almorzando','Cenando','Snack','Tomando agua'] },
  { id:'rest',   label:'Descanso',  emoji:'😴', color:'#8b5cf6', options:['Durmiendo','Siesta','Relajándome','Meditando'] },
  { id:'hobby',  label:'Hobbies',   emoji:'🎮', color:'#ec4899', options:['Juegos','Música','Lectura','Arte','Series/Películas'] },
  { id:'other',  label:'Otro',      emoji:'✨', color:'#6b7280', options:['Transporte','Compras','Social','Sin hacer nada'] },
];
const MOODS = ['😫','😕','😐','🙂','😄'];

let db = { entries: [] };
let selectedCat = null;
let selectedOption = null;
let selectedMood = null;
let nextCheckinMs = null;
let countdownInterval = null;
let hourlyTimeout = null;
let hourlyInterval = null;

// ── STORAGE ───────────────────────────────────────────────────────────────────
function loadDB() {
  try { db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { entries:[] }; }
  catch { db = { entries:[] }; }
}
function saveDB() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

// ── VIEWS ─────────────────────────────────────────────────────────────────────
function showView(name) {
  ['home','checkin','history','stats'].forEach(v => {
    document.getElementById('view-'+v).style.display = v===name ? 'flex' : 'none';
  });
  document.getElementById('view-'+name).style.flexDirection = 'column';
  if (name==='home') renderHome();
  if (name==='history') renderHistory();
  if (name==='stats') renderStats();
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function renderHome() {
  // Last entry
  const last = db.entries[0];
  const lastSec = document.getElementById('last-entry-section');
  if (last) {
    const cat = CATEGORIES.find(c=>c.id===last.category);
    lastSec.style.display = 'block';
    const card = document.getElementById('last-entry-card');
    card.style.borderLeft = `3px solid ${cat.color}`;
    card.innerHTML = `
      <div class="entry-row">
        <span style="font-size:24px">${cat.emoji}</span>
        <div style="flex:1">
          <div class="entry-meta">
            <span style="color:${cat.color};font-weight:700">${cat.label}</span>
            ${last.option ? `<span class="pill">${last.option}</span>` : ''}
            ${last.mood!==null ? `<span>${MOODS[last.mood]}</span>` : ''}
          </div>
          ${last.note ? `<div style="color:#6b7280;font-size:12px;margin-top:4px">${esc(last.note)}</div>` : ''}
          <div class="time-tag">${timeAgo(last.timestamp)}</div>
        </div>
      </div>`;
  } else {
    lastSec.style.display = 'none';
  }

  // Today summary
  const today = db.entries.filter(e => sameDay(e.timestamp));
  const todaySec = document.getElementById('today-section');
  if (today.length > 0) {
    todaySec.style.display = 'block';
    document.getElementById('today-label').textContent = `Hoy — ${today.length} registros`;
    const counts = {};
    today.forEach(e => counts[e.category] = (counts[e.category]||0)+1);
    const chips = document.getElementById('today-chips');
    chips.innerHTML = CATEGORIES.filter(c=>counts[c.id]).map(cat=>`
      <div class="today-chip" style="background:${cat.color}22;border:1px solid ${cat.color}44">
        <span>${cat.emoji}</span>
        <span style="color:${cat.color}">${counts[cat.id]}</span>
      </div>`).join('');
  } else {
    todaySec.style.display = 'none';
  }
}

// ── CHECK-IN ──────────────────────────────────────────────────────────────────
function openCheckin() {
  selectedCat = null; selectedOption = null; selectedMood = null;
  document.getElementById('checkin-note').value = '';
  document.getElementById('checkin-time').textContent =
    new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  renderCatGrid();
  renderMoods();
  document.getElementById('options-section').style.display = 'none';
  document.getElementById('save-btn').disabled = true;
  document.getElementById('save-btn').style.opacity = '.4';
  showView('checkin');
}

function renderCatGrid() {
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = CATEGORIES.map(cat => `
    <button class="cat-btn ${selectedCat===cat.id?'active':''}"
      style="${selectedCat===cat.id ? `background:${cat.color}33;border-color:${cat.color};color:${cat.color}` : ''}"
      onclick="selectCat('${cat.id}')">
      <div style="font-size:22px">${cat.emoji}</div>
      <div>${cat.label}</div>
    </button>`).join('');
}

function selectCat(id) {
  selectedCat = id; selectedOption = null;
  renderCatGrid();
  const cat = CATEGORIES.find(c=>c.id===id);
  const sec = document.getElementById('options-section');
  sec.style.display = 'block';
  document.getElementById('options-chips').innerHTML = cat.options.map(opt=>`
    <button class="chip" id="chip-${slugify(opt)}"
      style="${selectedOption===opt ? `background:${cat.color};color:#fff;border-color:${cat.color}` : ''}"
      onclick="selectOption('${opt}')">
      ${opt}
    </button>`).join('');
  document.getElementById('save-btn').disabled = false;
  document.getElementById('save-btn').style.opacity = '1';
}

function selectOption(opt) {
  selectedOption = opt;
  const cat = CATEGORIES.find(c=>c.id===selectedCat);
  document.querySelectorAll('#options-chips .chip').forEach(btn => {
    const isActive = btn.textContent.trim() === opt;
    btn.style.background = isActive ? cat.color : '#1a1f2e';
    btn.style.color = isActive ? '#fff' : '#9ca3af';
    btn.style.borderColor = isActive ? cat.color : '#2a3040';
  });
}

function renderMoods() {
  document.getElementById('mood-row').innerHTML = MOODS.map((m,i)=>`
    <button class="mood-btn ${selectedMood===i?'active':''}" onclick="selectMood(${i})">${m}</button>
  `).join('');
}

function selectMood(i) {
  selectedMood = i;
  document.querySelectorAll('.mood-btn').forEach((btn,j) => {
    btn.classList.toggle('active', j===i);
  });
}

function saveEntry() {
  if (!selectedCat) return;
  const entry = {
    id: Date.now(),
    timestamp: new Date().toISOString(),
    category: selectedCat,
    option: selectedOption,
    note: document.getElementById('checkin-note').value.trim(),
    mood: selectedMood,
  };
  db.entries.unshift(entry);
  saveDB();
  showView('home');
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderHistory() {
  document.getElementById('history-count').textContent = db.entries.length;
  const list = document.getElementById('history-list');
  if (db.entries.length === 0) {
    list.innerHTML = `<div style="text-align:center;color:#6b7280;margin-top:60px"><div style="font-size:48px">📋</div><div>Sin registros aún</div></div>`;
    return;
  }
  list.innerHTML = db.entries.map(e => {
    const cat = CATEGORIES.find(c=>c.id===e.category);
    return `
    <div class="card" style="border-left:3px solid ${cat.color}">
      <div class="entry-row">
        <span style="font-size:22px">${cat.emoji}</span>
        <div style="flex:1">
          <div class="entry-meta">
            <span style="color:${cat.color};font-weight:700;font-size:13px">${cat.label}</span>
            ${e.option ? `<span class="pill">${e.option}</span>` : ''}
            ${e.mood!==null ? `<span style="font-size:16px">${MOODS[e.mood]}</span>` : ''}
          </div>
          ${e.note ? `<div style="color:#9ca3af;font-size:12px;margin-top:4px">${esc(e.note)}</div>` : ''}
          <div class="time-tag">${fmt(e.timestamp)} · ${timeAgo(e.timestamp)}</div>
        </div>
        <button class="del-btn" onclick="deleteEntry(${e.id})">×</button>
      </div>
    </div>`;
  }).join('');
}

function deleteEntry(id) {
  db.entries = db.entries.filter(e=>e.id!==id);
  saveDB();
  renderHistory();
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const total = db.entries.length;
  const today = db.entries.filter(e=>sameDay(e.timestamp)).length;
  const moodEntries = db.entries.filter(e=>e.mood!==null);
  const avgMood = moodEntries.length
    ? (moodEntries.reduce((s,e)=>s+e.mood,0)/moodEntries.length).toFixed(1) : null;
  const counts = {};
  CATEGORIES.forEach(c=>counts[c.id]=0);
  db.entries.forEach(e=>{ if(counts[e.category]!==undefined) counts[e.category]++; });

  document.getElementById('stats-grid').innerHTML = [
    { label:'Total registros', val: total, emoji:'📊' },
    { label:'Hoy', val: today, emoji:'📅' },
    { label:'Ánimo promedio', val: avgMood ? `${MOODS[Math.round(avgMood)]} ${avgMood}` : '—', emoji:'😊' },
    { label:'Días activos', val: new Set(db.entries.map(e=>e.timestamp.slice(0,10))).size, emoji:'📆' },
  ].map(s=>`
    <div class="stat-card">
      <div style="font-size:24px">${s.emoji}</div>
      <div class="stat-val">${s.val}</div>
      <div class="stat-lbl">${s.label}</div>
    </div>`).join('');

  document.getElementById('stats-bars').innerHTML = CATEGORIES.map(cat=>{
    const pct = total ? Math.round(counts[cat.id]/total*100) : 0;
    return `
    <div class="bar-row">
      <span style="font-size:18px;width:24px">${cat.emoji}</span>
      <span style="color:#9ca3af;font-size:12px;width:70px">${cat.label}</span>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${cat.color}"></div>
      </div>
      <span style="color:#6b7280;font-size:12px;width:28px;text-align:right">${counts[cat.id]}</span>
    </div>`;
  }).join('');
}

// ── NOTIFICATIONS + COUNTDOWN ─────────────────────────────────────────────────
function requestNotif() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(p => {
    if (p==='granted') document.getElementById('notif-banner').style.display='none';
  });
}

function checkNotifBanner() {
  if (!('Notification' in window) || Notification.permission==='granted') {
    document.getElementById('notif-banner').style.display='none';
  } else {
    document.getElementById('notif-banner').style.display='flex';
  }
}

function fireHourlyCheckin() {
  // pulse effect
  const ring = document.createElement('div');
  ring.className = 'pulse-ring';
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(), 1200);

  // browser notification
  if ('Notification' in window && Notification.permission==='granted') {
    try {
      new Notification('⏰ ¿Qué estás haciendo?', {
        body: 'Es hora de registrar tu actividad',
      });
    } catch {}
  }
  openCheckin();
}

function startCountdown() {
  clearTimeout(hourlyTimeout);
  clearInterval(hourlyInterval);
  clearInterval(countdownInterval);

  const now = new Date();
  const msToNext = (60 - now.getMinutes()) * 60000 - now.getSeconds() * 1000;
  nextCheckinMs = msToNext;

  countdownInterval = setInterval(()=>{
    nextCheckinMs = Math.max(0, nextCheckinMs - 1000);
    const m = Math.floor(nextCheckinMs/60000);
    const s = Math.floor((nextCheckinMs%60000)/1000);
    const el = document.getElementById('countdown');
    if (el) el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }, 1000);

  hourlyTimeout = setTimeout(()=>{
    fireHourlyCheckin();
    hourlyInterval = setInterval(()=>{
      fireHourlyCheckin();
      nextCheckinMs = 3600000;
    }, 3600000);
  }, msToNext);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmt(d) {
  return new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'}).format(new Date(d));
}
function timeAgo(d) {
  const mins = Math.floor((Date.now()-new Date(d))/60000);
  if (mins<1) return 'ahora';
  if (mins<60) return `hace ${mins}m`;
  const hrs = Math.floor(mins/60);
  if (hrs<24) return `hace ${hrs}h`;
  return `hace ${Math.floor(hrs/24)}d`;
}
function sameDay(ts) {
  return new Date(ts).toDateString()===new Date().toDateString();
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function slugify(s) {
  return s.replace(/[^a-z0-9]/gi,'-').toLowerCase();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadDB();
showView('home');
checkNotifBanner();
startCountdown();
</script>
